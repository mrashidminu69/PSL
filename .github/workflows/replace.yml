name: Replace Frame

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download level files
        run: |
          gdown "LEVEL1_SPLIT0_FILE_ID" -O level1.split0
          gdown "LEVEL1_SPLIT1_FILE_ID" -O level1.split1

      - name: Replace frame
        run: python replace_frame.py

      - name: Check output
        run: |
          ls -la patched_level1.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-level1
          path: patched_level1.zip
