name: Replace Logos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download files
        run: |
          gdown "1jBYfxhL92cEtqTTmSGF5RfqsjqDDPgn-" -O sharedassets0_merged.zip
          gdown "1lWy1xWfhzJJbom8T9tDPM1EmYm2s2PJ9" -O logos.zip
          unzip sharedassets0_merged.zip
          ls -la

      - name: Replace logos
        run: python replace_logos.py

      - name: Check output
        run: |
          ls -la patched_sharedassets0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-logos
          path: patched_sharedassets0.zip
