name: Replace HH Texture in 160

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download files
        run: |
          gdown "1gH-s4Eht5JgJefsdXh1VZC1UqQ_HzWQk" -O 160.zip
          gdown "12o5Mr4kIB_UReuZzL_aXnww2GSAgoxB7" -O diff_HH_Uniform_209.png

      - name: Replace texture
        run: python replace_all.py

      - name: Check output
        run: |
          ls -la patched_160.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-160
          path: patched_160.zip
