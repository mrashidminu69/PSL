name: Replace HH Texture in 160

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download files
        run: |
          gdown "1dBDdepUC9tjPN3YA1If06NgM5QmmsGLH" -O sharedassets2_merged.assets
          gdown "12o5Mr4kIB_UReuZzL_aXnww2GSAgoxB7" -O diff_HH_Uniform_209.png

      - name: Replace and split
        run: python replace_merged.py

      - name: Check output
        run: |
          ls -la patched_160_parts.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-160-parts
          path: patched_160_parts.zip
