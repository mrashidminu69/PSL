name: Patch Logos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download files
        run: |
          gdown "1ovduNPBAE-I6aFqI-J3c43lO69YgmBWh" -O sharedassets0_merged.assets
          gdown "1GGdx3H0rTCOM5kI8EsvqRfc3Y7j6KV9f" -O logos.zip
          unzip -o logos.zip
          ls -la

      - name: Patch logos
        run: python patch_logos.py sharedassets0_merged.assets patched_sharedassets0.assets logos/

      - name: Split into 25 parts
        run: |
          mkdir -p new_splits
          split -b 1048576 -d -a 1 patched_sharedassets0.assets new_splits/sharedassets0.assets.split
          cd new_splits/
          for f in sharedassets0.assets.split*; do
              num=$(echo $f | sed 's/.*split//')
              mv "$f" "sharedassets0.assets.split$num"
          done
          cd ..
          ls -la new_splits/
          zip -r patched_splits.zip new_splits/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-splits
          path: patched_splits.zip
