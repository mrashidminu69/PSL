name: Replace HH Texture

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install UnityPy pillow gdown

      - name: Download files
        run: |
          gdown "1CMxmU71sf2v2x5VP6fQr8cEn44ShJXJN" -O sharedassets2.assets.split0
          gdown "12o5Mr4kIB_UReuZzL_aXnww2GSAgoxB7" -O diff_HH_Uniform_209.png

      - name: Replace texture
        run: python replace_texture.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-split0
          path: patched_split0
